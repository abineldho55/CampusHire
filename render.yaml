services:
  - type: web
    name: campushire
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn campusHire.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "False"
